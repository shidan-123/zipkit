[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zipkit-tool"
version = "1.1.0"
description = "简单安全的压缩/解压小工具：支持 txt/log/csv/json/bmp/wav/tiff 压缩，zip/7z/gz/docx/xlsx/pptx 解压，自带本地网页界面"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "shidan-123" }]
keywords = ["compression", "zip", "7z", "gzip", "docx", "cross-platform", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
sevenzip = ["py7zr>=0.20"]
dev = [
    "pytest>=7",
    "py7zr>=0.20",
    "pillow>=9",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
]

[project.scripts]
zipkit = "zipkit.cli:main"

[project.urls]
Homepage = "https://github.com/shidan-123/zipkit"

[tool.setuptools]
packages = ["zipkit", "zipkit.core", "zipkit.web"]

[tool.setuptools.package-data]
"zipkit.web" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
