name: release

# 打一个 v* 的 tag 就自动发版：跑测试 → 重建 App → 打包 → 建 Release 并挂上产物。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    name: 打包 macOS 应用并发布
    runs-on: macos-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 测试（不绿就不发）
        run: python -m pytest -q

      - name: 重建应用包（把版本号写进 Info.plist）
        run: python scripts/build_app.py

      - name: 打 zip + 校验
        run: python scripts/package_release.py

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ZipKit-*-macos.zip
            dist/SHA256SUMS.txt
